<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Pets on Adoption</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="pets.html">Our Pets</a>
    <a href="adopt.html">How to Adopt</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main>
    <h1>CONTACT US</h1>
    <p class="center">Questions about a pet? Send us a message.</p>

    <form onsubmit="submitContact(event)">
      <label for="name">Your name</label>
      <input type="text" id="name" required>

      <label for="email">Your email</label>
      <input type="email" id="email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <h2>Visit Us</h2>
    <p>Sample address: Pets on Adoption Shelter, Islamabad, Pakistan</p>
  </main>

  <footer>
    &copy; 2026 Pets on Adoption &middot; Muhammad Qasim &middot; 26i-3180 &middot; BSE-D
  </footer>

  <script src="script.js"></script>
</body>
</html>
